apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shophub
  namespace: argocd
  annotations:
    # Wave 2: zavisi od shop crd-ja, shop operator u wave 1 i service monitor crd-ja u wave 0
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: shophub
  sources:
    - repoURL: registry-1.docker.io/urospetraskovic
      chart: shophub
      targetRevision: 0.2.4
      helm:
        valueFiles:
          - $values/clusters/local/shophub/values.yaml
    - repoURL: https://github.com/shophub-devoops/kube-state.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shophub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
