apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-operator
  namespace: argocd
  annotations:
    # Wave 1: installs the Shop/DiscordChannel/Wallet CRDs and a PrometheusRule
    # (so it must come after kube-prometheus-stack's monitoring CRDs in wave 0),
    # and before shophub which uses the Shop CRD.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: shophub
  sources:
    # OCI Helm chart published by the helm-charts repo. The registry is
    # registered as an OCI-enabled repository in argocd/repositories.yaml.
    - repoURL: registry-1.docker.io/urospetraskovic
      chart: shop-operator
      targetRevision: 0.1.8
      helm:
        valueFiles:
          - $values/clusters/local/shop-operator/values.yaml
    - repoURL: https://github.com/shophub-devoops/kube-state.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
