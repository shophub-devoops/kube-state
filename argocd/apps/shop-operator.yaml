apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-operator
  namespace: argocd
  annotations:
    # Wave 1: instalira 3 glavna CRD-ja i prometeus rule tako da mora posle wave 0
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: shophub
  sources:
    - repoURL: registry-1.docker.io/urospetraskovic
      chart: shop-operator
      targetRevision: 0.1.13
      helm:
        valueFiles:
          - $values/clusters/local/shop-operator/values.yaml
    - repoURL: https://github.com/shophub-devoops/kube-state.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
