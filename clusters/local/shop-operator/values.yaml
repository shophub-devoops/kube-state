# Value overrides for the shop-operator chart on the local k3d cluster.
# cluster.yaml maps the loadbalancer's :80 to host :8080, so a Shop's clickable
# URL needs the ":8080" suffix to resolve from the host browser.
ingress:
  baseDomain: localhost
  urlPort: ":8080"

# Per-tenant Grafana org provisioning (spec 4.1 optional). The admin password
# is read from the pre-created grafana-admin Secret in this release's namespace
# (same password as the monitoring-namespace copy Grafana itself uses); see the
# kube-state README "Grafana admin secret" step.
grafana:
  url: http://kube-prometheus-stack-grafana.monitoring
  adminUser: admin
  existingSecret: grafana-admin

# Cluster-level alerts (NodeHighCPU/NodeHighMemory) → maintainers Discord
# channel. The chart creates a DiscordChannel CR (operator provisions the
# channel + webhook on the guild) and an AlertmanagerConfig in the monitoring
# namespace. Same guild + bot token Secret as the shophub chart's per-shop
# channels; the token itself lives only in the pre-created discord-bot-token
# Secret (see SETUP.md), never in git.
clusterAlerts:
  enabled: true
  discord:
    guildId: "1508273714897092648"
    botTokenSecret:
      name: discord-bot-token
      namespace: shophub
