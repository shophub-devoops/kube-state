# Value overrides for the shop-operator chart on the local k3d cluster.
# cluster.yaml maps the loadbalancer's :80 to host :8080, so a Shop's clickable
# URL needs the ":8080" suffix to resolve from the host browser.
ingress:
  baseDomain: localhost
  urlPort: ":8080"

# Per-tenant Grafana org provisioning (spec 4.1 optional). adminPassword matches
# the fixed value set in clusters/local/kube-prometheus-stack/values.yaml.
grafana:
  url: http://kube-prometheus-stack-grafana.monitoring
  adminUser: admin
  adminPassword: shophub-grafana-admin
