## Local k3d overrides for kube-prometheus-stack.
## Production values would lift these (esp. retention + storage).

prometheus:
  prometheusSpec:
    # k3d nodes are docker containers with bounded RAM — keep Prometheus modest.
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi
    # 1 day retention is enough for demo. Production: 15d+.
    retention: 1d
    # Accept ServiceMonitor / PodMonitor from any namespace without the default
    # `release: kube-prometheus-stack` label requirement. The Shop operator
    # creates ServiceMonitors in tenant namespaces; we don't want to label
    # them with the stack release name.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  # Default admin password is overridden by Helm to a random value stored in
  # the kube-prometheus-stack-grafana Secret. Read it with:
  # kubectl get secret -n monitoring kube-prometheus-stack-grafana \
  #   -o jsonpath='{.data.admin-password}' | base64 -d
  # NOTE: the Loki datasource is provided by the loki-stack chart's own
  # datasource ConfigMap (grafana_datasource=1), auto-loaded by this Grafana's
  # sidecar — we don't add it here to avoid a duplicate / default conflict.
  # Tempo (tracing) has no auto-datasource, so we add it explicitly. Non-default
  # to keep Prometheus as the single default datasource.
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3100
      isDefault: false
  # Place each dashboard in the Grafana folder named by its `grafana_folder`
  # annotation (the Shop operator sets it to the tenant namespace). Folder-level
  # permissions then scope each tenant's dashboards to that tenant — the access
  # control for spec 4.1 "users see only their own dashboards".
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

alertmanager:
  alertmanagerSpec:
    # Pick up AlertmanagerConfig CRs from any namespace. OnNamespace strategy
    # auto-scopes each config's routes to its own namespace — per-Shop alert
    # isolation: a Shop's AlertmanagerConfig only routes that namespace's
    # alerts to that Shop's Discord channel (apiURL secret-ref, URL never in git).
    #
    # We deliberately do NOT set an inline `config` with discord_configs: the
    # prometheus-operator validates inline configs against its own schema, which
    # lacks webhook_url_file, so a secret-ref webhook is only possible via the
    # AlertmanagerConfig CRD's apiURL field.
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    alertmanagerConfigMatcherStrategy:
      type: OnNamespace
