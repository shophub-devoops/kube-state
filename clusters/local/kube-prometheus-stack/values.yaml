prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi
    retention: 1d     # 1 dan pamcenja
    # prometheus prihvata servicem onitore iz bilo kog namespacea bez obavezne labele
    # znaci hvatamo sve podatke bez obzira na labelu
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  persistence:
    enabled: true   # cuvaju se podaci
    size: 2Gi
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.localhost
    path: /
    pathType: Prefix
  additionalDataSources:  # tempo nema auto-datasource kao loki, pa ga dodajemo rucno
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3100
      isDefault: false
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder    # per tenant izolacija
      provider:
        foldersFromFilesStructure: true

alertmanager:
  alertmanagerSpec:
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    alertmanagerConfigMatcherStrategy:
      type: OnNamespace
