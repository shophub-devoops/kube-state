# Value overrides for the shophub chart on the local k3d cluster.
# Chart defaults are used: image.repository = docker.io/urospetraskovic/shophub-backend
# and image.tag defaults to the chart appVersion (0.1.0), which exists on the
# registry once the v0.1.0 tag is pushed in the shophub repo. Add overrides
# below if the local cluster needs them (e.g. a different image tag).

# Per-tenant Grafana access (spec 4.1 optional). The admin password is read
# from the pre-created grafana-admin Secret in this release's namespace (same
# password as the monitoring-namespace copy Grafana itself uses); see the
# kube-state README "Grafana admin secret" step. externalUrl is the
# host-browser URL the tenant opens (k3d maps loadbalancer :80 to :8080).
grafana:
  url: http://kube-prometheus-stack-grafana.monitoring
  externalUrl: http://grafana.localhost:8080
  adminUser: admin
  existingSecret: grafana-admin
